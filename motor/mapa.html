<body>
<div id="mapa"></div>
<div id="vinheta"></div>
<div id="pinos"></div>
<div id="topo"><div id="marca">INEMA · ALERTA SUL</div><div id="selo"></div></div>
<div id="hero"></div>
<div id="painel" class="painel"></div>
<div id="cta"></div>
<div id="club"></div>
<div id="relogio"></div>
<div id="fonte"></div>
<div id="faixa"></div>
<div id="tagnei">NEI MALDANER · INEMA</div>
<div id="leg"></div>
<script>
const C = window.CENA, G = window.GEO;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
// janela [ini,fim] com entrada/saida de dur s
function vis(t,a,b,d=.35){ if(t<a||t>b) return 0; return Math.min(a<=0?1:clamp((t-a)/d),clamp((b-t)/d)); }
function prog(t,a,dur){ return ease(clamp((t-a)/dur)); }
// pseudo-aleatório estável
function rnd(i){ const x=Math.sin(i*9301+49297)*233280; return x-Math.floor(x); }

document.getElementById('selo').textContent=C.selo;
if(C.marca) document.getElementById('marca').textContent=C.marca;
if(C.layout==='avatar') document.body.classList.add('av');
if(C.layout==='canto') document.body.classList.add('cn');
const LG=C.layout==='largo'; if(LG){document.documentElement.classList.add('lg'); document.body.classList.add('lg');}
if(LG&&C.coluna) document.body.classList.add('cd');
const W=LG?1920:1080, H=LG?1080:1920;
const IMG={};
function carregar(src){ if(IMG[src]) return IMG[src].p; const im=new Image(); im.src=src; IMG[src]={im,p:im.decode().then(()=>im)}; return IMG[src].p; }
const preload=[]; if(C.sat){ if(C.sat.base) preload.push(carregar(C.sat.base)); (C.sat.ir?.frames||[]).forEach(f=>preload.push(carregar(f))); }
(C.imagens||[]).forEach(m=>preload.push(carregar(m.src)));  // imagens extras, cada uma com bbox e janela de tempo
// ---- partículas de vento (estado sequencial; reconstruído se o tempo voltar)
let PART=null, tPart=-1;
function campo(x,y,h){ const V=C.vento; const g=V.grade; const i=(x-g.x0)/g.dx, j=(y-g.y0)/g.dy;
  const i0=Math.max(0,Math.min(g.nx-2,Math.floor(i))), j0=Math.max(0,Math.min(g.ny-2,Math.floor(j))); const fx=clamp(i-i0), fy=clamp(j-j0);
  const at=(a,b)=>V.uv[h][b*g.nx+a];
  const m=(k)=>lerp(lerp(at(i0,j0)[k],at(i0+1,j0)[k],fx),lerp(at(i0,j0+1)[k],at(i0+1,j0+1)[k],fx),fy);
  return [m(0),m(1)]; }
function passoVento(t){ const V=C.vento; const dt=1/30;
  if(!PART||t<tPart){ PART=[]; for(let i=0;i<V.n;i++) PART.push({x:lerp(V.bbox[0],V.bbox[2],rnd(i)),y:lerp(V.bbox[1],V.bbox[3],rnd(i+7777)),vida:rnd(i+333)*V.vida,trilha:[]}); tPart=V.ini; }
  while(tPart<t){ const h=Math.min(V.uv.length-1,Math.floor(lerp(V.hora0,V.hora1,clamp((tPart-V.ini)/(V.fim-V.ini)))));
    PART.forEach((p,i)=>{ const [u,v]=campo(p.x,p.y,h); p.x+=u*V.k*dt; p.y+=v*V.k*dt; p.vida-=dt; p.trilha.push([p.x,p.y]); if(p.trilha.length>V.cauda) p.trilha.shift();
      if(p.vida<=0||p.x<V.bbox[0]||p.x>V.bbox[2]||p.y<V.bbox[1]||p.y>V.bbox[3]){ p.x=lerp(V.bbox[0],V.bbox[2],Math.random()); p.y=lerp(V.bbox[1],V.bbox[3],Math.random()); p.vida=V.vida*(.5+Math.random()*.5); p.trilha=[]; } });
    tPart+=dt; } }
const munById={}; G.mun.features.forEach(f=>munById[f.properties.id]=f);

// ---- câmera: interpola keyframes
function camera(t){
  const k=C.camera; let i=0; while(i<k.length-1 && t>=k[i+1].t) i++;
  const a=k[i], b=k[Math.min(i+1,k.length-1)];
  const p=b.t>a.t? ease(clamp((t-a.t)/(b.t-a.t))):0;
  return {longitude:lerp(a.lon,b.lon,p),latitude:lerp(a.lat,b.lat,p),zoom:lerp(a.zoom,b.zoom,p),
          pitch:lerp(a.pitch||0,b.pitch||0,p),bearing:lerp(a.bearing||0,b.bearing||0,p),
          ...(C.layout==='avatar'||C.layout==='canto'?{padding:{top:0,bottom:C.padding_baixo||820,left:0,right:0}}:{}),
          ...(LG?{padding:{top:0,bottom:0,left:0,right:C.padding_dir??640}}:{}),
          ...(C.layout==='cheio'&&C.padding_topo?{padding:{top:C.padding_topo,bottom:0,left:0,right:0}}:{})};
}
const mapa = new deck.Deck({parent:document.getElementById('mapa'),width:W,height:H,controller:false,
  initialViewState:camera(0),useDevicePixels:false,_animate:false,
  parameters:{clearColor:[0.02,0.05,0.09,1]}});

function camadas(t){
  const L=[];
  const S=C.sat; const comSat=S&&S.base&&IMG[S.base];
  if(comSat){
    L.push(new deck.BitmapLayer({id:'satbase',image:IMG[S.base].im,bounds:S.bbox,tintColor:S.tint||[200,200,200],opacity:1}));
    if(S.ir){ const o=vis(t,S.ir.ini,S.ir.fim,.6);
      if(o){ const fr=S.ir.frames; const x=clamp((t-S.ir.ini)/S.ir.dur)*(fr.length-1); const a=Math.floor(x), b=Math.min(fr.length-1,a+1), k=x-a;
        L.push(new deck.BitmapLayer({id:'irA',image:IMG[fr[a]].im,bounds:S.bbox,opacity:o*(S.ir.alfa||.9)}));
        if(b!==a) L.push(new deck.BitmapLayer({id:'irB',image:IMG[fr[b]].im,bounds:S.bbox,opacity:o*k*(S.ir.alfa||.9)}));
        const R=document.getElementById('relogio'); R.textContent=S.ir.rotulo+' · '+S.ir.tempos[Math.round(x)]; R.style.opacity=o; }
      else document.getElementById('relogio').style.opacity=0; }
  }
  (C.imagens||[]).forEach((m,i)=>{ const o=vis(t,m.ini,m.fim,m.fade??.8); if(!o) return;
    L.push(new deck.BitmapLayer({id:'img-'+i,image:IMG[m.src].im,bounds:m.bbox,tintColor:m.tint||[255,255,255],opacity:o*(m.alfa??1)})); });
  if(!comSat) L.push(new deck.GeoJsonLayer({id:'paises',data:G.paises,filled:true,stroked:true,getFillColor:[22,27,34],getLineColor:[70,80,95],lineWidthMinPixels:1.5}));
  if(!comSat) L.push(new deck.GeoJsonLayer({id:'ufbase',data:G.uf,filled:true,stroked:false,getFillColor:[30,36,46]}));
  else L.push(new deck.GeoJsonLayer({id:'paisesl',data:G.paises,filled:false,stroked:true,getLineColor:[255,255,255,90],lineWidthMinPixels:1.2}));
  // camada de alerta por municipio
  for(const a of C.alertas||[]){
    const o=vis(t,a.ini,a.fim,.5); if(!o) continue;
    const ordem=a.ordem||{};
    if(!a._dados){const ids=new Set(a.ids); a._dados=G.mun.features.filter(f=>ids.has(f.properties.id));}
    L.push(new deck.GeoJsonLayer({id:'al-'+a.id,data:a._dados,
      filled:true,stroked:true,lineWidthMinPixels:.6,getLineColor:[255,255,255,Math.round(60*o)],
      getFillColor:f=>{const d=ordem[f.properties.id]||0; const k=clamp((t-a.ini-d*a.varredura)/.4);
        return [...a.cor, Math.round(a.alfa*255*k*o)];},
      updateTriggers:{getFillColor:t,getLineColor:t}}));
  }
  // camada por estado (geo sem municípios): pinta as UFs listadas
  for(const e of C.estados||[]){
    const o=vis(t,e.ini,e.fim,.5); if(!o) continue;
    if(!e._dados){const s=new Set(e.ufs); e._dados=G.uf.features.filter(f=>s.has(f.properties.uf));}
    const k=clamp((t-e.ini)/.6);
    L.push(new deck.GeoJsonLayer({id:'es-'+e.id,data:e._dados,filled:true,stroked:false,
      getFillColor:[...e.cor,Math.round(e.alfa*255*k*o)],updateTriggers:{getFillColor:t}}));
  }
  L.push(new deck.GeoJsonLayer({id:'uf',data:G.uf,filled:false,stroked:true,getLineColor:[220,228,240,160],lineWidthMinPixels:2.5}));
  // rios com desenho progressivo
  for(const r of C.rios||[]){
    const o=vis(t,r.ini,r.fim,.4); if(!o) continue;
    const p=prog(t,r.ini,r.dur||2.5);
    if(!r._paths){r._paths=[]; G.rios.features.filter(f=>f.properties.nome===r.nome).forEach(f=>{const cs=f.geometry.type==='LineString'?[f.geometry.coordinates]:f.geometry.coordinates; cs.forEach(c=>r._paths.push(c));});}
    const q=Math.round(p*40)/40; if(r._q!==q){r._q=q; r._cort=r._paths.map(c=>c.slice(0,Math.max(2,Math.round(c.length*q))));}
    const cortados=r._cort;
    L.push(new deck.PathLayer({id:'rio-'+r.nome,data:cortados,getPath:d=>d,getColor:[94,200,255,Math.round(255*o)],
      getWidth:r.largura||7,widthUnits:'pixels',capRounded:true,jointRounded:true,updateTriggers:{getColor:t}}));
    L.push(new deck.PathLayer({id:'rioglow-'+r.nome,data:cortados,getPath:d=>d,getColor:[94,200,255,Math.round(70*o)],
      getWidth:(r.largura||7)*4,widthUnits:'pixels',capRounded:true,updateTriggers:{getColor:t}}));
  }
  // colunas 3D
  for(const c of C.colunas||[]){
    const o=vis(t,c.ini,c.fim,.5); if(!o) continue;
    const ordem=c.ordem||{};
    L.push(new deck.ColumnLayer({id:'col-'+c.id,data:c.dados,diskResolution:12,radius:c.raio||5500,extruded:true,
      elevationScale:1,getPosition:d=>d.p,
      getElevation:d=>{const k=prog(t,c.ini+(ordem[d.id]||0)*c.varredura,1.2);return d.v*c.escala*k;},
      getFillColor:d=>[...(d.cor||c.cor),Math.round(235*o)],material:{ambient:.55,diffuse:.6,shininess:40},
      updateTriggers:{getElevation:t,getFillColor:t}}));
  }
  // pontos (raios, estações)
  for(const s of C.pontos||[]){
    const o=vis(t,s.ini,s.fim,.4); if(!o) continue;
    const n=Math.round(s.dados.length*prog(t,s.ini,s.dur||3));
    const vis_=s.dados.slice(0,n);
    L.push(new deck.ScatterplotLayer({id:'pt-'+s.id,data:vis_,getPosition:d=>d.p,getRadius:d=>d.r||s.raio||3,radiusUnits:'pixels',
      getFillColor:d=>{const idade=(t-(s.ini+(d.i/s.dados.length)*(s.dur||3)));const f=clamp(1-idade/.6);
        return [...s.cor.map((c,j)=>Math.round(lerp(c,255,f))),Math.round(255*o)];},
      stroked:!!s.borda,getLineColor:[255,255,255,Math.round(200*o)],lineWidthMinPixels:s.borda||0,
      updateTriggers:{getFillColor:t}}));
  }
  if(C.vento){ const o=vis(t,C.vento.ini,C.vento.fim,.6);
    if(o){ passoVento(t); L.push(new deck.PathLayer({id:'vento',data:PART.filter(p=>p.trilha.length>1),getPath:p=>p.trilha,
      getColor:[255,255,255,Math.round(215*o)],getWidth:3.2,widthUnits:'pixels',capRounded:true,updateTriggers:{getPath:t,getColor:t}})); } }
  return L;
}

// gráfico de previsão: barras empilhadas por série (ex.: regiões) por dia, sobe com prog; total em cima de cada coluna.
// g = {rotulos:[..], series:[{nome,cor,v:[..]}], unid:'mm', ini, dur, previsto_a_partir: indice (colunas dali em diante hachuradas), linha:{nome,cor,v:[..],unid}}
function grafico(g,t,p){
  const W=620,H=270,L=40,R=10,T=26,B=46,n=g.rotulos.length,k=prog(t,g.ini??p.ini,g.dur||1.4);
  const tot=g.rotulos.map((_,i)=>g.series.reduce((a,s)=>a+(s.v[i]||0),0)); const mx=Math.max(...tot,1)*1.12;
  const bw=(W-L-R)/n, y=v=>H-B-(H-B-T)*v/mx; let o=`<svg class="graf" viewBox="0 0 ${W} ${H}">`;
  for(let q=0;q<=3;q++){const v=mx*q/3; o+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.14)"/><text x="${L-6}" y="${y(v)+5}" font-size="15" text-anchor="end" opacity=".7">${Math.round(v)}</text>`;}
  g.rotulos.forEach((r,i)=>{
    const x=L+i*bw+bw*.14, w=bw*.72, prev=g.previsto_a_partir!=null&&i>=g.previsto_a_partir; let base=0;
    g.series.forEach(s=>{const v=(s.v[i]||0)*k; if(v<=0) return; const y0=y(base+v), h=y(base)-y0;
      o+=`<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="${s.cor}" opacity="${prev?.78:1}" ${prev?'stroke="#fff" stroke-opacity=".5" stroke-dasharray="5 4"':''}/>`; base+=v;});
    o+=`<text x="${x+w/2}" y="${y(base)-7}" font-size="19" font-weight="900" text-anchor="middle" opacity="${k}">${Math.round(tot[i])}</text>`;
    o+=`<text x="${x+w/2}" y="${H-B+22}" font-size="18" font-weight="800" text-anchor="middle">${r}</text>`;
  });
  if(g.linha){const L2=g.linha, mn=Math.min(...L2.v)-2, M2=Math.max(...L2.v)+2, yy=v=>H-B-(H-B-T)*(v-mn)/(M2-mn);
    const pts=L2.v.map((v,i)=>[L+i*bw+bw/2,yy(v)]).slice(0,Math.max(1,Math.ceil(k*L2.v.length)));
    o+=`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${L2.cor}" stroke-width="4"/>`+pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${L2.cor}"/><text x="${q[0]}" y="${q[1]-10}" font-size="16" font-weight="800" text-anchor="middle" fill="${L2.cor}" style="fill:${L2.cor}">${Math.round(L2.v[i])}°</text>`).join('');}
  o+='</svg>'; o+='<div class="leg">'+g.series.map(s=>`<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join('')+(g.linha?`<span><i style="background:${g.linha.cor}"></i>${g.linha.nome}</span>`:'')+'</div>';
  return o;
}

// ranking: onde o volume é MAIOR (Nei, 13/10/2026: destacar o maior volume, não média). r={itens:[{nome,v,sub?}], cor, unid, ini, dur}
function ranking(r,t,p){
  const k=prog(t,r.ini??p.ini,r.dur||1.2), mx=Math.max(...r.itens.map(i=>i.v),1);
  return '<div class="rk">'+r.itens.map((i,n)=>`<div class="r ${n==0?'top':''}"><span class="nm">${n==0?'▲ ':''}${i.nome}</span>`+
    `<span class="bar"><i style="width:${(100*i.v/mx*k).toFixed(1)}%;background:${n==0?(r.cor_top||r.cor):r.cor}"></i></span>`+
    `<span class="vl" style="color:${n==0?(r.cor_top||r.cor):'#fff'}">${Math.round(i.v*k).toLocaleString('pt-BR')} ${r.unid||''}</span></div>`).join('')+'</div>';
}

function html(t){
  const H=document.getElementById('hero'); const h=(C.hero||[]).find(x=>t>=x.ini&&t<=x.fim);
  if(h){H.innerHTML=h.html;H.style.opacity=h.ini<=0?clamp((h.fim-t)/.3):vis(t,h.ini,h.fim,.3);} else H.style.opacity=0;
  // painel com contador
  const P=document.getElementById('painel'); const p=(C.paineis||[]).find(x=>t>=x.ini&&t<=x.fim);
  if(p){
    let corpo='';
    if(p.contador){const c=p.contador; const k=prog(t,c.ini??p.ini,c.dur||2); const v=lerp(c.de,c.ate,k);
      const s=v.toLocaleString('pt-BR',{minimumFractionDigits:c.dec||0,maximumFractionDigits:c.dec||0});
      corpo=`<div class="n" style="color:${c.cor||'#fff'}">${s}</div><div class="u">${c.unid||''}</div>`;}
    if(p.grafico) corpo+=grafico(p.grafico,t,p);
    if(p.ranking) corpo+=ranking(p.ranking,t,p);
    if(p.itens) corpo+='<div class="itens">'+p.itens.map(i=>`<div class="${t>=i.t?'on':''}">${i.txt}</div>`).join('')+'</div>';
    P.innerHTML=`<div class="k">${p.k}</div>${corpo}${p.l?`<div class="l">${p.l}</div>`:''}`;
    P.classList.toggle('g',!!(p.grafico||p.ranking)); P.style.opacity=vis(t,p.ini,p.fim,.3); P.style.borderColor=p.borda||'rgba(255,255,255,.12)';
  } else P.style.opacity=0;
  const CT=document.getElementById('cta'); const c=C.cta;
  if(c){CT.innerHTML=`<div class="a">${c.a}</div><div class="b">${c.b}</div>`;CT.style.opacity=vis(t,c.ini,c.fim,.3);}
  const CL=document.getElementById('club'); const cl=C.club;
  if(cl){CL.innerHTML=`<div class="ic">▶</div><div class="tx">${cl.a}<small>${cl.b}</small></div>`;CL.style.opacity=vis(t,cl.ini,cl.fim,.3);}
  const F=document.getElementById('fonte'); const f=(C.fontes||[]).find(x=>t>=x.ini&&t<=x.fim);
  if(f){F.innerHTML=f.html;F.style.opacity=vis(t,f.ini,f.fim,.3);} else F.style.opacity=0;
  // legenda: bloco de palavras ativo
  const B=(C.legenda||[]).find(b=>t>=b.ini&&t<b.fim); const Lg=document.getElementById('leg');
  Lg.innerHTML=B? B.palavras.map(w=>`<span style="color:${t>=w.t?(w.cor||'#fff'):'rgba(255,255,255,.35)'}">${w.w}</span>`).join(''):'';
}

function pinos(t,vp){
  const box=document.getElementById('pinos'); let s='';
  for(const p of C.pinos||[]){
    const o=vis(t,p.ini,p.fim,.3); if(!o) continue;
    const [x,y]=vp.project([p.lon,p.lat]); const k=prog(t,p.ini,.5);
    s+=`<div class="pino" style="left:${x}px;top:${y}px;opacity:${o};--h:${(p.h||90)*k}px"><div class="cx">${p.nome}<small>${p.sub||''}</small></div><div class="haste"></div><div class="pt"></div></div>`;
  }
  box.innerHTML=s;
}

let aguardando=null, tAtual=0;
mapa.setProps({onAfterRender:()=>{ if(!aguardando) return; const r=aguardando; aguardando=null;
  const vp=mapa.getViewports()[0]; if(vp) pinos(tAtual,vp); html(tAtual); requestAnimationFrame(()=>r(true)); }});
window.render = t => new Promise(res=>{
  tAtual=t; aguardando=res;
  mapa.setProps({viewState:camera(t),layers:camadas(t)});
  mapa.redraw(true);
});
window.pronto = new Promise(r=>{ const iv=setInterval(()=>{ if(mapa.isInitialized){clearInterval(iv); Promise.all([document.fonts.ready,...preload]).then(()=>r(true));} },50); });
</script></body></html>
